<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Tenor+Sans&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Menú BASTARDO</title>
    <style>
      /* Pantalla de carga: se muestra antes de que cargue React y la oculta hideSplash() */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        transition: opacity .45s ease;
      }
      #splash.splash-hide { opacity: 0; pointer-events: none; }

      /*
        Video de la animación (public/splash.mp4, 576 x 1248, fondo negro).
        El logo ocupa x 103-465 / y 258-941 del cuadro: recortamos esa zona.
      */
      #splash .splash-logo {
        position: relative;
        width: min(32vw, 150px);
        aspect-ratio: 362 / 683;
        overflow: hidden;
      }
      #splash .splash-logo video {
        position: absolute;
        width: 159.12%;
        height: auto;
        left: -28.45%;
        top: -37.77%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Cargando menú">
      <div class="splash-logo">
        <video src="/splash.mp4" autoplay muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
      </div>
    </div>
    <script>
      // Por si algo falla, nunca dejar la pantalla de carga más de 10 s
      setTimeout(function () {
        var el = document.getElementById("splash");
        if (el) el.remove();
      }, 10000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
